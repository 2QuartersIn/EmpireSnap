name: Build EmpireSnap (Windows + macOS)

# Builds installers for both platforms in the cloud - no Node, and no Mac,
# needed on your own machine. GitHub runs the macOS job on a real Mac.
#
# Two ways to trigger it:
#   1. Actions tab -> "Build EmpireSnap (Windows + macOS)" -> "Run workflow"
#      (produces downloadable artifacts)
#   2. Publish a Release, or push a tag like v1.9.0
#      (also uploads the installers to that Release, which is what
#       the app's auto-updater reads)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis portable
          - os: macos-latest
            name: macos
            args: --mac dmg zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node (on the runner, not your machine)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.name }}
        # GH_TOKEN is provided automatically; electron-builder uses it to
        # attach artifacts to the Release when triggered by a tag/release.
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops the macOS job trying to
        # code-sign with a certificate we don't have.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish onTagOrDraft

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: EmpireSnap-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30
