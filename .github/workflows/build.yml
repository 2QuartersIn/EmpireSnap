name: Build EmpireSnap (Windows + macOS)

# Builds installers for both platforms in the cloud - no Node, and no Mac,
# needed on your own machine. GitHub runs the macOS job on a real Mac.
#
# Two ways to trigger it:
#   1. Actions tab -> "Build EmpireSnap (Windows + macOS)" -> "Run workflow"
#      (produces downloadable artifacts)
#   2. Publish a Release, or push a tag like v1.9.0
#      (also uploads the installers to that Release, which is what
#       the app's auto-updater reads)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the built files to this release tag (leave blank to use the latest release)"
        required: false
        default: ""

  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis portable
          - os: macos-latest
            name: macos
            args: --mac dmg zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node (on the runner, not your machine)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.name }}
        # GH_TOKEN is provided automatically; electron-builder uses it to
        # attach artifacts to the Release when triggered by a tag/release.
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops the macOS job trying to
        # code-sign with a certificate we don't have.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish onTagOrDraft

      # A manual "Run workflow" is not a tag build, so electron-builder will
      # not publish to a release — which is why manually-built installers only
      # ever appeared as run artifacts. This attaches them to the release
      # directly, so either route ends up with downloadable files.
      - name: Attach installers to the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          fi
          if [ -z "$TAG" ]; then
            echo "No release found - skipping upload (artifacts are still attached to this run)."
            exit 0
          fi
          shopt -s nullglob
          # .yml files are what electron-updater reads, so silent
          # auto-updates only work if they are on the release too
          FILES=(dist/*.exe dist/*.dmg dist/*.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installers found in dist/ - skipping."
            exit 0
          fi
          echo "Uploading ${#FILES[@]} file(s) to release $TAG"
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: EmpireSnap-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30
