<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EmpireSnap</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(120% 120% at 50% 0%, #232744 0%, #0e0f14 62%);
        color: #e9eaf0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        user-select: none; overflow: hidden;
        border: 1px solid #2b2f45;
        border-radius: 16px;
        -webkit-app-region: drag;
      }
      .logo {
        width: 96px; height: 96px; border-radius: 26px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 46px rgba(79,70,229,.55);
        animation: pop .55s cubic-bezier(.2,.9,.3,1.3) both;
      }
      .logo img { width: 96px; height: 96px; border-radius: 26px; }
      h1 {
        margin: 20px 0 0; font-size: 30px; letter-spacing: -0.6px;
        animation: rise .5s .12s both;
      }
      p {
        margin: 8px 0 0; font-size: 13px; color: #9096ab;
        animation: rise .5s .2s both;
      }
      .credits {
        margin: 14px 0 0; font-size: 11.5px; color: #7b8098;
        text-align: center; line-height: 1.55; max-width: 300px;
        animation: rise .5s .34s both;
      }
      .credits b { color: #a9adc4; font-weight: 600; }
      .brand { color: #8b90ff; font-weight: 600; }
      .bar {
        margin-top: 26px; width: 168px; height: 3px;
        background: #222534; border-radius: 3px; overflow: hidden;
        animation: rise .5s .28s both;
      }
      .bar i {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, #6366f1, #a5a8ff);
        border-radius: 3px; animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes pop { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
      @keyframes slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div class="logo"><img src="../build/icon.png" alt="" onerror="this.style.display='none'" /></div>
    <h1>EmpireSnap</h1>
    <p>by <span class="brand">2QuartersIn</span></p>
    <p class="credits">
      Created by <b>2QuartersIn</b>, <b>Chizz</b><br />
      and the <b>EmpireTrading Team</b>
    </p>
    <div class="bar"><i></i></div>
  </body>
</html>
